apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alivtina/devops-lab.git
    targetRevision: main
    path: helm/app-demo
    helm:
      releaseName: app-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: app-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
