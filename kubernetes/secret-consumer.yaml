apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-consumer
  namespace: webapp
  annotations:
    secret.reloader.stakater.com/reload: "webapp-demo-secret"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-consumer
  template:
    metadata:
      labels:
        app: secret-consumer
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          env:
            - name: DEMO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: webapp-demo-secret
                  key: username
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webapp-demo-secret
                  key: password
