apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webapp-demo
  namespace: webapp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: webapp-demo-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: webapp-demo
        property: username
    - secretKey: password
      remoteRef:
        key: webapp-demo
        property: password
