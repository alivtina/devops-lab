name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/system-health/requirements.txt
          pip install pytest

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'

      - name: Run tests
        run: ./tests/test-health-check.sh

      - name: Run Python tests
        run: pytest

      - name: Build artifact
        run: |
          mkdir -p build
          cp scripts/*.sh build/
          tar -czf linux-server-lab.tar.gz -C build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-lab
          path: linux-server-lab.tar.gz

  deploy:
    needs: shellcheck
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-server-lab

      - name: Deploy
        run: |
          sudo -n tar -xzf linux-server-lab.tar.gz -C /opt/linux-server-lab
          sudo -n chmod +x /opt/linux-server-lab/*.sh

      - name: Verify deployment
        run: |
          test -x /opt/linux-server-lab/health-check.sh
          test -x /opt/linux-server-lab/system-info.sh
          echo "Deployment verified"

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd docker/app-demo
          docker build -t app-demo:ci .

      - name: Run container
        run: |
          docker run -d \
            --name app-demo-ci \
            -p 8080:8000 \
            app-demo:ci

      - name: Wait for container health
        run: |
          for i in {1..10}; do
            status=$(docker inspect -f '{{.State.Health.Status}}' app-demo-ci)
            echo "Container health: $status"

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            sleep 3
          done

          docker inspect app-demo-ci
          exit 1

      - name: Test application
        run: |
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/

      - name: Cleanup
        if: always()
        run: |
          docker rm -f app-demo-ci || true

  docker-system-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t system-health:ci \
            python/system-health

      - name: Run system health container
        run: |
          docker run --rm system-health:ci

  publish-app-demo:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build and publish image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-lab-app-demo"
          docker build \
            -t "$IMAGE:${GITHUB_SHA}" \
            docker/app-demo
          docker push "$IMAGE:${GITHUB_SHA}"
